<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓝牙设备控制</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>蓝牙设备控制</h1>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">未连接</span>
      <button id="btnConnect" class="btn-connect" data-action="connect">连接设备</button>
    </div>
  </header>

  <main class="main">
    <!-- 设备信息卡片（连接成功后显示） -->
    <section id="deviceInfo" class="device-info" style="display:none;">
      <div class="dev-info-row"><span class="dev-label">名称</span><span id="devName" class="dev-value">—</span></div>
      <div class="dev-info-row"><span class="dev-label">ID</span><span id="devId" class="dev-value">—</span></div>
    </section>

    <!-- 主控按钮区 -->
    <section class="section">
      <h2 class="section-title">主控</h2>
      <div class="main-controls">
        <button id="btnOpen" class="btn btn-open" disabled>开</button>
        <button id="btnClose" class="btn btn-close" disabled>关</button>
        <button id="btnStop" class="btn btn-stop" disabled>停</button>
      </div>
    </section>

    <!-- 点动按钮区 -->
    <section class="section">
      <h2 class="section-title">点动（长按有效，松开即停）</h2>
      <div class="momentary-controls">
        <button id="btnOpening" class="btn btn-momentary btn-opening" disabled>点动开</button>
        <button id="btnClosing" class="btn btn-momentary btn-closing" disabled>点动关</button>
      </div>
      <p class="hint">提示：按住按钮持续动作，松开自动停止。手指滑出按钮也会停止。</p>
    </section>

    <!-- 日志区 -->
    <section class="section section-log">
      <h2 class="section-title">日志</h2>
      <div id="logArea" class="log-area"></div>
    </section>
  </main>

  <!-- 连接设置 Modal -->
  <div id="connectModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle" class="modal-title">连接蓝牙设备</h3>

      <!-- 扫描模式 -->
      <div class="modal-section">
        <p class="modal-label">扫描模式</p>
        <label class="mode-option">
          <input type="radio" name="scanMode" value="nus_only" checked>
          <span>仅 NUS 设备（推荐，过滤严格）</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="scanMode" value="by_name">
          <span>按名称前缀过滤</span>
        </label>
        <input type="text" id="namePrefixInput" class="name-input"
               placeholder="设备名前缀（如 ESP32）" disabled
               maxlength="32" autocomplete="off">
        <label class="mode-option">
          <input type="radio" name="scanMode" value="all">
          <span>显示所有 BLE 设备（兜底，列表最全）</span>
        </label>
        <p class="mode-hint" id="modeHint">仅显示注册了 Nordic UART Service 的设备。如果列表为空，请改用其他模式。</p>
      </div>

      <!-- 最近连接 -->
      <div class="modal-section">
        <div class="recent-header">
          <p class="modal-label">最近连接</p>
          <button id="clearRecentBtn" class="link-btn" type="button">清空</button>
        </div>
        <div id="recentDevices" class="recent-devices"></div>
      </div>

      <!-- 操作按钮 -->
        <div class="modal-actions">
          <button id="modalCancel" class="btn-secondary" type="button">取消</button>
          <button id="modalConfirm" class="btn-primary" type="button">开始扫描</button>
        </div>

        <p class="mode-hint" style="margin-top:12px;">
          点击"开始扫描"后，浏览器将弹出原生蓝牙设备选择器，列表中会显示附近所有可发现的 BLE 设备。
          选中设备后点击"连接"即可。
        </p>
    </div>
  </div>

  <!-- 脚本顺序：protocol（无依赖）→ bluetooth（依赖 protocol）→ ui（依赖两者）→ app（入口）-->
  <script src="js/protocol.js"></script>
  <script src="js/bluetooth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
